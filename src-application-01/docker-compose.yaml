services:
  frontend:
    image: traefik:3.1
    command:
      - --providers.docker
      - --entrypoints.web.address=:80
      - --providers.docker.exposedbydefault=false
      - --api.dashboard=true   # Enable the dashboard
      - --api.insecure=true    # Allow access without authentication (remove this in production or secure it)
    ports:
      # The HTTP port
      - "80:80"
      # The dashboard port
      - "8080:8080"
    volumes:
      # So that Traefik can listen to Docker events
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - backend

  backend:
    build: backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.go.rule=Path(`/v1/hello-world`)"
      - "traefik.http.services.go.loadbalancer.server.port=80"
